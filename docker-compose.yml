services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: civicconnect
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_demo_data --count 50 && gunicorn civicconnect.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://civic:civic@db/civicconnect
    depends_on: [db]
volumes: { pgdata: {} }
