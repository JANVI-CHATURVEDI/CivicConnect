[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["venv", "migrations", "__pycache__", "staticfiles", "media"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "BLE", "RUF", "UP"]
ignore = [
  "BLE001", # deliberate: every external call (Gemini, geocode, mail) degrades gracefully
  "S110",   # deliberate: silent fallbacks are the offline-demo design
  "RUF012", # Django convention: model/serializer/form field declarations
  "S101",   # asserts are the test suite
]

[tool.ruff.lint.per-file-ignores]
"reports/tests.py" = ["S101", "S106"]
"reports/management/commands/*" = ["S101", "S105", "S106", "S311"]
