{% extends 'base.html' %}

{% block content %}

<div class="head">
    <h1>My reports</h1>
    <a class="btn" href="/report/new/">+ New report</a>
</div>

{% for x in reports %}

<a class="row" href="/reports/{{ x.id }}/">

    <span>
        <b>#{{ x.id }} · {{ x.title }}</b>

        <small>
            {{ x.get_category_display }} ·
            {{ x.created_at|date:'d M Y' }}
        </small>
    </span>

    <span class="badge {{ x.status }}">
        {{ x.get_status_display }}
    </span>

</a>

{% empty %}

<p>No reports yet.</p>

{% endfor %}

{% endblock %}
