{% extends "base.html" %}
{% block content %}
<div class="card" style="padding:24px;max-width:800px;margin:24px auto;">
<h1>Notifications {% if unread %}({{ unread }} unread){% endif %}</h1>
<p><a href="?mark=read">Mark all read</a></p>
{% for n in notifications %}
<div class="card" style="padding:10px;margin:8px 0;{% if not n.read %}border-left:4px solid var(--cc-accent);{% endif %}">
{{ n.message }} <small>{{ n.created_at }}</small>
{% if n.report_id %}<a href="{% url 'detail' n.report_id %}">View</a>{% endif %}
</div>
{% empty %}<p>No notifications.</p>{% endfor %}
</div>
{% endblock %}
