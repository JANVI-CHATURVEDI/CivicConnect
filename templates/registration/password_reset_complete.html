{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Reset Complete | CivicConnect AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-container" style="grid-template-columns:1fr;max-width:460px;">
    <div class="login-right">
      <div class="login-form-container" style="text-align:center;">
        <h2>Password Updated</h2>
        <p class="login-subtitle">Your password has been changed successfully.</p>
        <a href="{% url 'login' %}" class="login-button" style="text-decoration:none;display:flex;"><span>Go to Login</span></a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
