{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Check Your Email | CivicConnect AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-container" style="grid-template-columns:1fr;max-width:460px;">
    <div class="login-right">
      <div class="login-form-container" style="text-align:center;">
        <h2>Check Your Email</h2>
        <p class="login-subtitle">
          If an account exists with that email, we've sent a link to reset your password.
          (In this local build, check the terminal running the server — the email is printed there.)
        </p>
        <p class="register-text"><a href="{% url 'login' %}">Back to Login</a></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
