{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | CivicConnect AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-container" style="grid-template-columns:1fr;max-width:460px;">
    <div class="login-right">
      <div class="login-form-container">
        <h2>Reset Your Password</h2>
        <p class="login-subtitle">Enter your account email and we'll send you a reset link.</p>
        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            <label for="id_email">Email Address</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-envelope"></i>
              {{ form.email }}
            </div>
            {% if form.email.errors %}<div class="django-error">{{ form.email.errors.0 }}</div>{% endif %}
          </div>
          <button type="submit" class="login-button"><span>Send Reset Link</span></button>
          <p class="register-text"><a href="{% url 'login' %}">Back to Login</a></p>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
