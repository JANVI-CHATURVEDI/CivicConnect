{% extends 'base.html' %}

{% block content %}

<div class="success-page">

    <div class="success-card anim-scale-in">

        <div class="success-icon">
            <svg class="icon-svg" viewBox="0 0 24 24" width="32" height="32"><polyline points="20 6 9 17 4 12"/></svg>
        </div>

        <h1>Report Submitted Successfully!</h1>

        <p class="success-message">
            Thank you for reporting this civic issue.
            Your report has been analyzed by our AI and routed to
            <strong>{{ report.department }}</strong>.
        </p>

        <div class="report-id">
            Report ID: <strong>#{{ report.id }}</strong>
        </div>

        <div class="success-actions">
            <a href="{% url 'detail' report.id %}" class="success-primary-btn">View My Report</a>
            <a href="{% url 'new' %}" class="success-secondary-btn">Report Another Issue</a>
        </div>

        <a href="{% url 'mine' %}" class="my-reports-link">Go to My Reports →</a>

        <canvas id="confetti"></canvas>

    </div>

</div>

<script>
(function () {
    var c = document.getElementById("confetti"), x = c.getContext("2d");
    c.width = innerWidth; c.height = innerHeight;
    var parts = Array.from({ length: 160 }, function () {
        return { x: Math.random() * c.width, y: -20 - Math.random() * c.height / 2, s: 4 + Math.random() * 6, v: 2 + Math.random() * 3, col: ["#2563eb", "#7c3aed", "#db2777", "#16c7b7"][Math.floor(Math.random() * 4)] };
    });
    var frames = 0;
    (function anim() {
        x.clearRect(0, 0, c.width, c.height);
        parts.forEach(function (p) { p.y += p.v; p.x += Math.sin(p.y / 20); x.fillStyle = p.col; x.fillRect(p.x, p.y, p.s, p.s * 0.6); });
        if (++frames < 220) requestAnimationFrame(anim); else c.remove();
    })();
})();
</script>

{% endblock %}
